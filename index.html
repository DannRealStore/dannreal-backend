<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DannReal's Store</title>
    <!-- I-load ang Opisyal na Pi Network SDK Script -->
    <script src="https://minepi.com"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; text-align: center; }
        .header { margin-bottom: 30px; }
        .header h1 { color: #0f3d2f; margin: 0; }
        .tagline { font-style: italic; color: #555; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .product-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 220px; text-align: center; }
        .product-title { font-weight: bold; margin-bottom: 10px; color: #333; }
        .product-price { color: #e67e22; font-size: 1.2em; font-weight: bold; margin-bottom: 15px; }
        .btn-pay { background-color: #8a3ab9; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: bold; width: 100%; transition: background 0.3s; }
        .btn-pay:hover { background-color: #6d2d93; }
        #status-log { margin-top: 20px; padding: 15px; background: #eef7f4; border-radius: 8px; font-family: monospace; display: inline-block; max-width: 600px; text-align: left; border: 1px solid #c2e2d6; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="header">
        <h1>DannReal's Store</h1>
        <p class="tagline">Your Trusted Web3 Pi Network Shop</p>
    </div>

    <div class="container">
        <!-- Unang Produkto -->
        <div class="product-card">
            <div class="product-title">Premium Sports Shoes</div>
            <div class="product-price">3.14 Pi</div>
            <button class="btn-pay" onclick="buyProduct('Premium Sports Shoes', 3.14)">Buy Now</button>
        </div>

        <!-- Pangalawang Produkto -->
        <div class="product-card">
            <div class="product-title">Sports Polo Shirt</div>
            <div class="product-price">1.00 Pi</div>
            <button class="btn-pay" onclick="buyProduct('Sports Polo Shirt', 1.00)">Buy Now</button>
        </div>
    </div>

    <br><br>
    <div id="status-log">Inihahanda ang Pi SDK...</div>

    <script>
        // Link ng iyong live backend server sa Render
        const SERVER_URL = "https://dannreal-backend.onrender.com";

        // Function para sa Pagbili / Transaksyon
        function buyProduct(memo, amount) {
            document.getElementById('status-log').innerText = "Inihahanda ang pagbili para sa: " + memo + "...";
            
            Pi.createPayment({
                amount: amount,
                memo: "Order: " + memo,
                metadata: { internalId: "order_" + Date.now() }
            }, {
                onReadyForServerApproval: function(paymentId) {
                    document.getElementById('status-log').innerText = "Payment Created! ID: " + paymentId + "\nInaprubahan ng Server...";
                    
                    fetch(`${SERVER_URL}/api/approve`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paymentId: paymentId })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.success) {
                            document.getElementById('status-log').innerText = "Server Approved! Waiting for blockchain confirmation...";
                        } else {
                            document.getElementById('status-log').innerText = "Approval Failed: " + JSON.stringify(data.error);
                        }
                    });
                },
                onReadyForServerCompletion: function(paymentId, txid) {
                    document.getElementById('status-log').innerText = "Payment Confirmed on Chain! TxID: " + txid + "\nTinutuloy ang Transaksyon...";
                    
                    fetch(`${SERVER_URL}/api/complete`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paymentId: paymentId, txid: txid })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.success) {
                            document.getElementById('status-log').innerText = "SUCCESS! Transaksyon Kumpleto! Salamat sa pagbili.";
                        } else {
                            document.getElementById('status-log').innerText = "Completion Failed: " + JSON.stringify(data.error);
                        }
                    });
                },
                onCancel: function(paymentId) {
                    document.getElementById('status-log').innerText = "Kanselado ang transaksyon ng user.";
                },
                onError: function(error, payment) {
                    document.getElementById('status-log').innerText = "Blockchain Error: " + error.message;
                }
            });
        }

        // I-initialize ang Pi SDK gamit ang bersyon 2.0
        Pi.init({ version: "2.0" });
        Pi.authenticate(['username'], function(auth) {
            document.getElementById('status-log').innerText = "Welcome, " + auth.user.username + "!\nPi SDK Ready.";
        }, function(error) {
            document.getElementById('status-log').innerText = "Auth Error: " + error.message;
        });
    </script>
</body>
</html>
