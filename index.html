<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DannReal's Store</title>
    <!-- TAMA NA SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; text-align: center; }
        .header { margin-bottom: 30px; }
        .header h1 { color: #0f3d2f; margin: 0; }
        .tagline { font-style: italic; color: #555; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .product-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 220px; text-align: center; }
        .product-title { font-weight: bold; margin-bottom: 10px; color: #333; }
        .product-price { color: #e67e22; font-size: 1.2em; font-weight: bold; margin-bottom: 15px; }
        .btn-pay { background-color: #8a3ab9; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: bold; width: 100%; transition: background 0.3s; }
        .btn-pay:hover { background-color: #6d2d93; }
        .btn-login { background-color: #0f3d2f; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: bold; margin-top: 15px; }
        #status-log { margin-top: 20px; padding: 15px; background: #eef7f4; border-radius: 8px; font-family: monospace; display: inline-block; max-width: 600px; text-align: left; border: 1px solid #c2e2d6; font-size: 0.9em; white-space: pre-line; }
    </style>
</head>
<body>

    <div class="header">
        <h1>DannReal's Store</h1>
        <p class="tagline">Your Trusted Web3 Pi Network Shop</p>
        <button class="btn-login" id="loginBtn" onclick="login()">Login with Pi</button>
        <div id="userInfo"></div>
    </div>

    <div class="container">
        <div class="product-card">
            <div class="product-title">Premium Sports Shoes</div>
            <div class="product-price">3.14 Pi</div>
            <button class="btn-pay" onclick="buyProduct('Premium Sports Shoes', 3.14)">Buy Now</button>
        </div>
        <div class="product-card">
            <div class="product-title">Sports Polo Shirt</div>
            <div class="product-price">1.00 Pi</div>
            <button class="btn-pay" onclick="buyProduct('Sports Polo Shirt', 1.00)">Buy Now</button>
        </div>
    </div>

    <br><br>
    <div id="status-log">Inihahanda ang Pi SDK...</div>

    <script>
        const SERVER_URL = "https://dannreal-backend.onrender.com";
        let currentUser = null;

        function setLog(msg) {
            document.getElementById('status-log').innerText = msg;
        }

        // Kailangan ito para sa mga hindi natapos na payment
        function onIncompletePaymentFound(payment) {
            console.log("Incomplete payment:", payment);
            fetch(`${SERVER_URL}/api/complete`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paymentId: payment.identifier, txid: payment.transaction.txid })
            });
        }

        async function login() {
            try {
                setLog("Nagbubukas ng Pi Login...");
                const auth = await Pi.authenticate(['username', 'payments'], onIncompletePaymentFound);
                currentUser = auth.user;
                document.getElementById('userInfo').innerText = "Welcome, @" + currentUser.username + "!";
                document.getElementById('loginBtn').style.display = 'none';
                setLog("Welcome, " + currentUser.username + "!\nPi SDK Ready. Pwede ka na bumili.");
            } catch (err) {
                setLog("Auth Error: " + (err.message || JSON.stringify(err)));
            }
        }

        async function buyProduct(memo, amount) {
            if (!currentUser) {
                setLog("Mag-login ka muna sa Pi bago bumili.");
                await login();
                if (!currentUser) return;
            }

            setLog("Inihahanda ang pagbili para sa: " + memo + "...");
            
            Pi.createPayment({
                amount: amount,
                memo: "Order: " + memo,
                metadata: { internalId: "order_" + Date.now() }
            }, {
                onReadyForServerApproval: function(paymentId) {
                    setLog("Payment Created! ID: " + paymentId + "\nInaprubahan ng Server...");
                    fetch(`${SERVER_URL}/api/approve`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paymentId: paymentId })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.success) {
                            setLog("Server Approved! Waiting for blockchain confirmation...");
                        } else {
                            setLog("Approval Failed: " + JSON.stringify(data.error));
                        }
                    });
                },
                onReadyForServerCompletion: function(paymentId, txid) {
                    setLog("Payment Confirmed on Chain! TxID: " + txid + "\nTinutuloy ang Transaksyon...");
                    fetch(`${SERVER_URL}/api/complete`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paymentId: paymentId, txid: txid })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.success) {
                            setLog("SUCCESS! Transaksyon Kumpleto! Salamat sa pagbili.");
                        } else {
                            setLog("Completion Failed: " + JSON.stringify(data.error));
                        }
                    });
                },
                onCancel: function(paymentId) {
                    setLog("Kanselado ang transaksyon ng user.");
                },
                onError: function(error, payment) {
                    setLog("Blockchain Error: " + error.message);
                }
            });
        }

        // INIT - sandbox:true muna habang test
        window.onload = function() {
            if (typeof Pi === 'undefined') {
                setLog("ERROR: Pi SDK hindi nag-load. Buksan mo lang ito sa Pi Browser.");
                return;
            }
            Pi.init({ version: "2.0", sandbox: true });
            setLog("Pi SDK Loaded. Pindutin ang Login with Pi.");
        };
    </script>
</body>
</html>
